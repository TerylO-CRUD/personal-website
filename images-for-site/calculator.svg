<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f4ec"/><stop offset="1" stop-color="#c9e3d4"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a6b4b"/><stop offset="1" stop-color="#184530"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0b2a1c" flood-opacity="0.28"/></filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg)"/>
  <circle cx="380" cy="20" r="70" fill="#fff" opacity="0.25"/>
  <circle cx="20" cy="240" r="60" fill="#fff" opacity="0.2"/>

  <rect x="45" y="18" width="160" height="214" rx="16" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="57" y="32" width="136" height="48" rx="8" fill="#e9f5ee"/>
  <text x="185" y="47" text-anchor="end" font-size="10" fill="#5b8a72">6 × 7</text>
  <text x="185" y="72" text-anchor="end" font-size="24" font-weight="bold" fill="#1a4a33">42</text>
  <rect x="57.0" y="92" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="71.75" y="109.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">7</text><rect x="92.5" y="92" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="107.25" y="109.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">8</text><rect x="128.0" y="92" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="142.75" y="109.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">9</text><rect x="163.5" y="92" width="29.5" height="26" rx="7" fill="#f2b84b"/><text x="178.25" y="109.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a3200">÷</text><rect x="57.0" y="124" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="71.75" y="141.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">4</text><rect x="92.5" y="124" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="107.25" y="141.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">5</text><rect x="128.0" y="124" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="142.75" y="141.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">6</text><rect x="163.5" y="124" width="29.5" height="26" rx="7" fill="#f2b84b"/><text x="178.25" y="141.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#4a3200">×</text><rect x="57.0" y="156" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="71.75" y="173.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">1</text><rect x="92.5" y="156" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="107.25" y="173.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">2</text><rect x="128.0" y="156" width="29.5" height="26" rx="7" fill="#ffffff"/><text x="142.75" y="173.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a4a33">3</text><rect x="163.5" y="156" width="29.5" height="26" rx="7" fill="#f