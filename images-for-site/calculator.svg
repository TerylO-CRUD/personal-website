  <rect x="225" y="40" width="150" height="150" rx="12" fill="#fff" filter="url(#shadow)"/>
  <text x="237" y="64" font-size="12" font-weight="bold" fill="#1f5c3f">HISTORY</text>
  <line x1="237" y1="72" x2="363" y2="72" stroke="#1f5c3f" stroke-width="2"/>
  <circle cx="241" cy="92" r="3" fill="#3b8c5f"/><text x="252" y="96" font-size="13" fill="#2b2b2b">5 + 3 = 8</text><line x1="237" y1="106" x2="363" y2="106" stroke="#e3ece6"/><circle cx="241" cy="118" r="3" fill="#3b8c5f"/><text x="252" y="122" font-size="13" fill="#2b2b2b">10 − 4 = 6</text><line x1="237" y1="132" x2="363" y2="132" stroke="#e3ece6"/><circle cx="241" cy="144" r="3" fill="#3b8c5f"/><text x="252" y="148" font-size="13" fill="#2b2b2b">6 × 7 = 42</text><line x1="237" y1="158" x2="363" y2="158" stroke="#e3ece6"/><circle cx="241" cy="170" r="3" fill="#3b8c5f"/><text x="252" y="174" font-size="13" fill="#2b2b2b">20 ÷ 5 = 4</text>
